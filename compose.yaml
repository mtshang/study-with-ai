name: study-with-ai

services:
  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: study_with_ai
      MYSQL_USER: study_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Initialize the local .env first}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Initialize the local .env first}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u"$$MYSQL_USER" -D"$$MYSQL_DATABASE" -e 'SELECT 1' >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: "no"

volumes:
  mysql_data:
